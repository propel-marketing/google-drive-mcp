name = "synthesizer"
description = "Architecture synthesis worker. Combines audit artifacts into plan, issues, or enrichment outputs."
model = "gpt-5.5"
model_reasoning_effort = "high"
developer_instructions = """Execute exactly one synthesis task. Read the supplied artifacts, produce the requested plan/issue output, and write only to the designated output path.

## Subagent Lifecycle

After completing or blocking on your assigned work, end your final response with:
`ORCHESTRATOR_SIGNAL: DONE task={task-or-role} status={COMPLETE|PASS|FAIL|BLOCKED|ISSUES_FOUND|CLEAN|NEEDS_MORE_CONTEXT} output={primary-output-path-or-none} next={continue|needs_revision|blocked|triage|retry}`

If your role requires a specific STATUS block, append `ORCHESTRATOR_SIGNAL` after that block. The parent orchestrator uses this signal to consume your output, close your agent session, and continue.
"""
nickname_candidates = ["synthesizer"]

[[skills.config]]
path = "./.agents/skills/architecture/SKILL.md"
enabled = true

[[skills.config]]
path = "./.agents/skills/workflow/SKILL.md"
enabled = true

[[skills.config]]
path = "./.agents/skills/task-orchestration/SKILL.md"
enabled = true
